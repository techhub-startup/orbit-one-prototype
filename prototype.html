  --color-background-rgb: 19,18,26;
  --color-on-background: #E5E1EE;
  --color-on-background-rgb: 229,225,238;
  --color-surface: #13121A;
  --color-surface-rgb: 19,18,26;
  --color-on-surface: #E5E1EE;
  --color-on-surface-rgb: 229,225,238;
  --color-surface-variant: #47455A;
  --color-surface-variant-rgb: 71,69,90;
  --color-on-surface-variant: #C8C5D8;
  --color-on-surface-variant-rgb: 200,197,216;
  --color-surface-container-lowest: #0E0D14;
  --color-surface-container-lowest-rgb: 14,13,20;
  --color-surface-container-low: #1B1A23;
  --color-surface-container-low-rgb: 27,26,35;
  --color-surface-container: #1F1E27;
  --color-surface-container-rgb: 31,30,39;
  --color-surface-container-high: #2A2932;
  --color-surface-container-high-rgb: 42,41,50;
  --color-surface-container-highest: #35343D;
  --color-surface-container-highest-rgb: 53,52,61;
  --color-outline: #928FA6;
  --color-outline-rgb: 146,143,166;
  --color-outline-variant: #47455A;
  --color-outline-variant-rgb: 71,69,90;
  --color-inverse-surface: #E5E1EE;
  --color-inverse-surface-rgb: 229,225,238;
  --color-inverse-on-surface: #302F39;
  --color-inverse-on-surface-rgb: 48,47,57;
  --color-inverse-primary: #4B3FD1;
  --color-inverse-primary-rgb: 75,63,209;
  --color-scrim: #000000;
  --color-scrim-rgb: 0,0,0;
  --cat-bill: #FFB47A;
  --cat-bill-container: #6B2C06;
  --cat-bill-on-container: #FFDCC2;
  --cat-payment: #6CE3A0;
  --cat-payment-container: #0A4A2E;
  --cat-payment-on-container: #C4F5D6;
  --cat-reminder: #9CC0FF;
  --cat-reminder-container: #123E86;
  --cat-reminder-on-container: #D8E5FF;
  --cat-delivery: #FF9CD1;
  --cat-delivery-container: #6E0F45;
  --cat-delivery-on-container: #FFD8EC;
  --scrim-opacity: 0.6;
  --elevation-level0: none;
  --elevation-level1: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
  --elevation-level2: 0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
  --elevation-level3: 0 1px 3px rgba(0,0,0,.30), 0 4px 8px 3px rgba(0,0,0,.15);
  --elevation-level4: 0 2px 3px rgba(0,0,0,.30), 0 6px 10px 4px rgba(0,0,0,.15);
  --elevation-level5: 0 4px 4px rgba(0,0,0,.30), 0 8px 12px 6px rgba(0,0,0,.15);
}

/* Orbit One mockup components, v0.2 (minimal, large type). Every colour / size comes from tokens.css variables. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--color-background); }
body { font-family: var(--font-brand); color: var(--color-on-surface); -webkit-font-smoothing: antialiased; width: 390px; height: 844px; overflow: hidden; }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
svg.i.s20 { width: 20px; height: 20px; } svg.i.s18 { width: 18px; height: 18px; } svg.i.s16 { width: 16px; height: 16px; }

/* ---- type roles ---- */
.display-small { font-size: var(--type-display-small-size); line-height: var(--type-display-small-line); font-weight: var(--type-display-small-weight); }
.headline-medium { font-size: var(--type-headline-medium-size); line-height: var(--type-headline-medium-line); font-weight: var(--type-headline-medium-weight); }
.headline-small { font-size: var(--type-headline-small-size); line-height: var(--type-headline-small-line); font-weight: var(--type-headline-small-weight); }
.title-large { font-size: var(--type-title-large-size); line-height: var(--type-title-large-line); font-weight: var(--type-title-large-weight); }
.title-medium { font-size: var(--type-title-medium-size); line-height: var(--type-title-medium-line); font-weight: var(--type-title-medium-weight); letter-spacing: var(--type-title-medium-tracking); }
.title-small { font-size: var(--type-title-small-size); line-height: var(--type-title-small-line); font-weight: var(--type-title-small-weight); letter-spacing: var(--type-title-small-tracking); }
.body-large { font-size: var(--type-body-large-size); line-height: var(--type-body-large-line); letter-spacing: var(--type-body-large-tracking); }
.body-medium { font-size: var(--type-body-medium-size); line-height: var(--type-body-medium-line); letter-spacing: var(--type-body-medium-tracking); }
.body-small { font-size: var(--type-body-small-size); line-height: var(--type-body-small-line); letter-spacing: var(--type-body-small-tracking); }
.label-large { font-size: var(--type-label-large-size); line-height: var(--type-label-large-line); font-weight: var(--type-label-large-weight); letter-spacing: var(--type-label-large-tracking); }
.label-medium { font-size: var(--type-label-medium-size); line-height: var(--type-label-medium-line); font-weight: var(--type-label-medium-weight); letter-spacing: var(--type-label-medium-tracking); }
.label-small { font-size: var(--type-label-small-size); line-height: var(--type-label-small-line); font-weight: var(--type-label-small-weight); letter-spacing: var(--type-label-small-tracking); }
.medium { font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--color-on-surface-variant); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; min-width: 0; }
.dot { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .7; vertical-align: middle; margin: 0 6px; }

/* ---- device chrome (unchanged from v1) ---- */
.screen { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--color-surface); display: flex; flex-direction: column; }
.statusbar { height: 32px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-lg) 0 var(--space-xxl); color: var(--color-on-surface); font-size: 14px; font-weight: 500; letter-spacing: .2px; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.statusbar svg.s14 { width: 14px; height: 14px; }
.gesturebar { height: 20px; flex: none; display: flex; align-items: center; justify-content: center; }
.gesturebar::after { content: ""; width: 108px; height: 4px; border-radius: 2px; background: var(--color-on-surface); opacity: .85; }
.content { flex: 1; overflow: hidden; position: relative; }

/* ---- top bars ---- */
.topbar { height: 48px; display: flex; align-items: center; gap: var(--space-sm); padding: 0 var(--space-screen-edge); }
.topbar.back { height: var(--top-app-bar-height); padding: 0 var(--space-xs); }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--shape-full); color: var(--color-on-surface-variant); flex: none; }
.topbar.back .iconbtn:first-child { color: var(--color-on-surface); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.wordmark { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -.2px; color: var(--color-on-surface); }
.wordmark b { color: var(--color-primary); font-weight: 700; }
.wordmark[role="button"] { cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; border-radius: 6px; }
.wordmark[role="button"]:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
.sample-badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--shape-full); background: var(--color-tertiary-container); color: var(--color-on-tertiary-container); font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; flex: none; }
.topbar.back .sample-badge { margin-right: var(--space-md); }

/* ---- shared bits ---- */
.cat { width: var(--category-icon-container); height: var(--category-icon-container); border-radius: var(--shape-medium); display: grid; place-items: center; flex: none; }
.cat.bill { background: var(--cat-bill-container); color: var(--cat-bill); }
.cat.payment { background: var(--cat-payment-container); color: var(--cat-payment); }
.cat.reminder { background: var(--cat-reminder-container); color: var(--cat-reminder); }
.cat.delivery { background: var(--cat-delivery-container); color: var(--cat-delivery); }
.t-overdue { color: var(--color-error); }
.t-today { color: var(--cat-bill); }
.t-paid { color: var(--cat-payment); }
.btn { height: var(--button-height); border-radius: var(--shape-full); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); padding: 0 var(--space-xxl); white-space: nowrap; }
.btn.filled { background: var(--color-primary); color: var(--color-on-primary); }
.btn.outlined { border: 1px solid var(--color-outline); color: var(--color-primary); }
.btn.outlined.danger { color: var(--color-error); border-color: var(--color-outline-variant); }
.btn.text { color: var(--color-primary); padding: 0 var(--space-md); height: 40px; }
.btn.block { display: flex; width: 100%; }
.surface-card { background: var(--color-surface-container-lowest); border: 1px solid var(--color-outline-variant); border-radius: var(--shape-extra-large); box-shadow: var(--elevation-level1); }
[data-theme='dark'] .surface-card { background: var(--color-surface-container-low); border-color: var(--color-outline-variant); box-shadow: none; }
.section-label { padding: var(--space-xxl) var(--space-screen-edge) var(--space-sm); color: var(--color-on-surface-variant); }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(rgba(var(--color-surface-rgb),0), rgba(var(--color-surface-rgb),1)); pointer-events: none; }
.privacy-note { display: flex; align-items: center; gap: var(--space-sm); color: var(--color-on-surface-variant); }
.privacy-note svg { color: var(--color-tertiary); }

/* ---- navigation bar ---- */
.nav-wrap { background: var(--color-surface-container); flex: none; }
.navbar { height: var(--navigation-bar-height); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 6px; }
.navitem { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 80px; color: var(--color-on-surface-variant); }
.navitem .pill { width: 64px; height: 32px; border-radius: var(--shape-full); display: grid; place-items: center; }
.navitem.active { color: var(--color-on-surface); }
.navitem.active .pill { background: var(--color-secondary-container); color: var(--color-on-secondary-container); }
.navitem.active .label-medium { font-weight: 700; }

/* ---- Glance (01) ---- */
.greet { padding: var(--space-sm) var(--space-screen-edge) var(--space-xl); }
.greet .headline-medium { font-weight: 500; letter-spacing: -0.4px; }
.greet .body-medium { margin-top: var(--space-xs); }
.g-card { margin: 0 var(--space-lg) var(--space-lg); overflow: hidden; }
.g-head { display: flex; align-items: center; gap: var(--space-sm); height: 56px; padding: 0 var(--space-xs) 0 var(--space-lg); }
.g-badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: var(--shape-full); display: inline-grid; place-items: center; font-size: var(--type-label-small-size); line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.g-badge.urgent { background: var(--color-error-container); color: var(--color-on-error-container); }
.g-badge.calm { background: var(--cat-reminder-container); color: var(--cat-reminder-on-container); }
.g-group { display: flex; align-items: center; gap: var(--space-xs); padding: 0 var(--space-lg) var(--space-xs); color: var(--cat-bill); }
.g-row { display: flex; align-items: center; gap: var(--space-md); min-height: var(--glance-row-min-height); padding: var(--space-md) var(--space-sm) var(--space-md) var(--space-lg); position: relative; }
.g-row + .g-row::before { content: ""; position: absolute; top: 0; left: 72px; right: var(--space-lg); border-top: 1px solid var(--color-outline-variant); }
.g-row .body-medium { margin-top: 2px; }
.g-row .amt { color: var(--color-on-surface); font-weight: 500; }
.g-amt { font-size: var(--type-title-small-size); line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-on-surface); flex: none; align-self: center; text-align: right; }
.g-amt.plus { color: var(--cat-payment); }
.g-amt.soft { font-size: 13px; font-weight: 500; color: var(--color-on-surface-variant); }
.warm { display: flex; align-items: flex-start; gap: 4px; color: var(--color-on-surface); }
.warm span { min-width: 0; }
.warm svg { color: var(--cat-payment); margin-top: 1px; flex: none; }
.g-row .due { display: flex; align-items: center; gap: 4px; margin-top: 2px; color: var(--color-on-surface-variant); }
.g-row .due.t-overdue { color: var(--color-error); }
.g-row .due.t-today { color: var(--cat-bill); }
.chev { width: 32px; display: grid; place-items: center; color: var(--color-on-surface-variant); flex: none; }
.g-row:last-child { padding-bottom: var(--space-lg); }

/* ---- Full feed (02) ---- */
.chips { display: flex; justify-content: space-between; padding: var(--space-xs) var(--space-screen-edge) var(--space-md); }
.chip { display: inline-flex; align-items: center; height: var(--chip-height); padding: 0 var(--space-sm); border-radius: var(--shape-small); border: 1px solid var(--color-outline-variant); color: var(--color-on-surface-variant); white-space: nowrap; flex: none; }
.chip.selected { background: var(--color-secondary-container); color: var(--color-on-secondary-container); border-color: transparent; font-weight: 700; }
.feed-sum { padding: 0 var(--space-screen-edge) var(--space-md); }
.list { display: flex; flex-direction: column; gap: var(--list-gap); padding: 0 var(--space-lg) 80px; }
.card { display: flex; align-items: center; gap: var(--space-md); padding: var(--card-padding); border-radius: var(--shape-large); }
.card .amount { font-size: var(--type-title-small-size); line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; align-self: flex-start; padding-top: 1px; }
.card .when { margin-top: 2px; display: flex; align-items: center; gap: 4px; }
.card .body-medium { margin-top: 2px; }
.surface-card.card { border-radius: var(--shape-large); }

/* ---- Item detail (03) ---- */
.hero { padding: var(--space-sm) var(--space-screen-edge) 0; }
.hero .who { display: flex; align-items: center; gap: var(--space-md); }
.hero .amount { margin-top: var(--space-lg); font-weight: 500; }
.hero .due { margin-top: var(--space-xxs); }
.hero .btn { margin-top: var(--space-lg); }
.x-card { margin: 0 var(--space-lg); padding: var(--space-lg); }
.x-summary { padding-left: var(--space-md); border-left: 3px solid var(--color-primary); }
.x-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md) var(--space-lg); margin-top: var(--space-lg); }
.x-grid dt { color: var(--color-on-surface-variant); }
.x-grid dd { color: var(--color-on-surface); font-weight: 500; }
.x-card .privacy-note { margin-top: var(--space-lg); }
.kv { margin: 0 var(--space-lg); padding: var(--space-xs) var(--space-lg); }
.kv .r { display: flex; align-items: center; justify-content: space-between; gap: var(--space-lg); min-height: 44px; }
.kv .r + .r { border-top: 1px solid var(--color-outline-variant); }
.kv .r span:last-child { text-align: right; }
.detail-foot { padding: var(--space-lg) var(--space-lg) 0; }

/* ---- Feedback sheet (04) ---- */
:root, [data-theme='light'] { --sheet-bg: var(--color-surface-container-low); }
[data-theme='dark'] { --sheet-bg: var(--color-surface-container-high); }
.scrim { position: absolute; inset: 0; background: rgba(var(--color-scrim-rgb), var(--scrim-opacity)); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--sheet-bg); border-radius: var(--shape-extra-large) var(--shape-extra-large) 0 0; box-shadow: var(--elevation-level3); display: flex; flex-direction: column; }
[data-theme='dark'] .sheet { box-shadow: 0 -1px 0 rgba(255,255,255,.06), var(--elevation-level3); }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--color-on-surface-variant); opacity: .4; margin: 16px auto 16px; }
.sheet .pad { padding: 0 var(--space-xxl); }
.opts { margin-top: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-sm); }
.opt { display: flex; align-items: center; gap: var(--space-lg); height: var(--feedback-option-height); padding: 0 var(--space-lg); border-radius: var(--shape-large); border: 1px solid var(--color-outline-variant); color: var(--color-on-surface); }
.opt > svg:first-child { color: var(--color-on-surface-variant); }
.opt.selected { background: var(--color-secondary-container); color: var(--color-on-secondary-container); border-color: transparent; }
.opt.selected > svg:first-child { color: var(--color-on-secondary-container); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--color-on-surface-variant); flex: none; display: grid; place-items: center; }
.opt.selected .radio { border-color: var(--color-primary); }
.opt.selected .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--color-primary); }
.sheet .privacy-note { margin-top: var(--space-lg); }
.sheet-actions { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-xl); }

/* ---- Settings / Profile (05) ---- */
.profile { display: flex; align-items: center; gap: var(--space-lg); padding: var(--space-lg) var(--space-screen-edge) var(--space-xs); }
.avatar-lg { width: var(--avatar-large); height: var(--avatar-large); border-radius: var(--shape-full); background: var(--color-primary-container); color: var(--color-on-primary-container); display: grid; place-items: center; font-size: 26px; font-weight: 500; flex: none; }
.s-group { margin: 0 var(--space-lg); overflow: hidden; }
.s-row { display: flex; align-items: center; gap: var(--space-lg); min-height: var(--settings-row-min-height); padding: var(--space-md) var(--space-lg); position: relative; }
.s-row + .s-row::before { content: ""; position: absolute; top: 0; left: 56px; right: var(--space-lg); border-top: 1px solid var(--color-outline-variant); }
.s-row > svg:first-child { color: var(--color-on-surface-variant); }
.s-row .body-medium { margin-top: 2px; }
.switch { width: var(--switch-width); height: var(--switch-height); border-radius: var(--shape-full); flex: none; position: relative; border: 2px solid var(--color-outline); background: var(--color-surface-container-highest); }
.switch::after { content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-outline); }
.switch.on { background: var(--color-primary); border-color: var(--color-primary); }
.switch.on::after { top: 2px; left: 22px; width: 24px; height: 24px; background: var(--color-on-primary); }
.settings-foot { padding: var(--space-xl) var(--space-screen-edge) 0; }
.kv .r.doc { color: var(--color-primary); }
.kv .r.doc .doc-l { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; font-weight: 500; text-align: left; }
.kv .r.doc > svg { color: var(--color-on-surface-variant); }

/* ---- Onboarding (06–10): no tab bar, one primary action pinned at the bottom ---- */
.onb .content { display: flex; flex-direction: column; }
.onb-body { flex: 1; display: flex; flex-direction: column; padding: 0 var(--space-xxl); min-height: 0; }
.onb-actions { flex: none; display: flex; flex-direction: column; gap: var(--space-xs); padding: var(--space-md) var(--space-xxl) var(--space-lg); }
.onb .step { padding-right: var(--space-lg); }
.onb-title { font-weight: 500; margin-top: var(--space-lg); }
.onb-sub { margin-top: var(--space-sm); }
.fine { display: flex; gap: var(--space-sm); align-items: flex-start; }
.fine svg { color: var(--color-tertiary); margin-top: 1px; }
.fine a { color: var(--color-primary); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
.onb-actions .fine { margin: var(--space-xs) 0 var(--space-sm); }
/* 06 sign in */
.brand-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--space-sm); padding-bottom: var(--space-xxxl); }
.brand-hero svg { margin-bottom: var(--space-lg); }
.wordmark-lg { font-size: 40px; line-height: 48px; font-weight: 700; letter-spacing: -.5px; color: var(--color-on-surface); }
.wordmark-lg b { color: var(--color-primary); font-weight: 700; }
.onb-actions > .fine:last-child { margin: var(--space-md) 0 0; justify-content: center; }
.name-field { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: 100%; text-align: left; }
.name-input { height: var(--button-height); width: 100%; border-radius: var(--shape-medium); border: 1px solid var(--color-outline); background: var(--color-surface-container-lowest); color: var(--color-on-surface); padding: 0 var(--space-lg); font: 400 var(--type-body-large-size)/var(--type-body-large-line) var(--font-brand); }
.name-input::placeholder { color: var(--color-on-surface-variant); }
.name-input:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; border-color: transparent; }
[data-theme='dark'] .name-input { background: var(--color-surface-container-highest); }
.name-input:-webkit-autofill, .profile-input:-webkit-autofill { -webkit-text-fill-color: var(--color-on-surface); caret-color: var(--color-on-surface); box-shadow: 0 0 0 1000px var(--color-surface-container-highest) inset; }
.profile-input { display: block; width: 100%; margin: 0; padding: 0; border: 0; border-radius: var(--shape-extra-small); background: transparent; color: var(--color-on-surface); font-family: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; letter-spacing: inherit; }
.profile-input::placeholder { color: var(--color-on-surface-variant); font-weight: 400; }
.profile-input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
/* 07 explainer points */
.points { display: flex; flex-direction: column; gap: var(--space-xxl); margin-top: var(--space-xxxl); }
.point { display: flex; gap: var(--space-lg); align-items: flex-start; }
.point-ic { width: var(--category-icon-container); height: var(--category-icon-container); border-radius: var(--shape-medium); display: grid; place-items: center; flex: none; background: var(--color-primary-container); color: var(--color-on-primary-container); }

/* ================= prototype page + interaction layer ================= */
html, body { width: auto; height: auto; min-height: 100%; overflow: auto; }

.hint { font-size: 12px !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.device { padding: 12px; border-radius: 52px; background: #1F1E24; box-shadow: 0 0 0 2px #3A3942, 0 20px 40px rgba(0,0,0,.25); position: relative; flex: none; }

#phone { border-radius: 40px; transform: translateZ(0); }
.stage { position: relative; flex: 1; overflow: hidden; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--color-surface); }

[data-action] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn, .chip, .opt, .navitem .pill, .iconbtn { transition: background-color var(--motion-short-duration) var(--motion-easing-standard), color var(--motion-short-duration) var(--motion-easing-standard), border-color var(--motion-short-duration) var(--motion-easing-standard), filter var(--motion-short-duration) var(--motion-easing-standard); }

/* Greeting and name. One phrase index per page load; the hour band is read when a screen renders. */
const NAME_KEY = 'orbit.one.name';
const GREET_KEY = 'orbit.one.greetRot';
const PAGE_QS = new URLSearchParams(location.search);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function savedName() {
  try { return (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { return ''; }
}
function saveName(raw) {
  const n = String(raw || '').trim().replace(/\s+/g, ' ').slice(0, 40);
  try { if (n) localStorage.setItem(NAME_KEY, n); else localStorage.removeItem(NAME_KEY); } catch (e) {}
  return n;
}
function clearFirstRun() { try { localStorage.removeItem(NAME_KEY); } catch (e) {} }
if (PAGE_QS.get('reset') === '1') clearFirstRun();
function hourNow() {
  const q = PAGE_QS.get('hour');
  if (q != null && q !== '' && Number.isFinite(+q)) return ((Math.trunc(+q) % 24) + 24) % 24;
  return new Date().getHours();
}
function dayBand(hour) {
  if (hour >= 5 && hour <= 11) return 'morning';
  if (hour >= 12 && hour <= 16) return 'afternoon';
  return 'evening';
}
const GREET_PHRASES = {
  morning: ['Good morning', 'Morning', 'Rise and shine'],
  afternoon: ['Good afternoon', 'Afternoon', 'Hope your afternoon is easy'],
  evening: ['Good evening', 'Evening', 'Settle in'],
};
const GREET_NO_NAME = new Set(['Hope your afternoon is easy']);
const GREET_INDEX = (() => {
  const q = PAGE_QS.get('greet');
  if (q != null && q !== '' && Number.isFinite(+q)) return ((Math.trunc(+q) % 3) + 3) % 3;
  let i = 0;
  try { i = parseInt(localStorage.getItem(GREET_KEY) || '0', 10); } catch (e) { i = 0; }
  if (!Number.isFinite(i)) i = 0;
  i = ((i % 3) + 3) % 3;
  try { localStorage.setItem(GREET_KEY, String((i + 1) % 3)); } catch (e) {}
  return i;
})();
function greetingPhrase() { return GREET_PHRASES[dayBand(hourNow())][GREET_INDEX]; }
function greetingText() {
  const phrase = greetingPhrase();
  const name = savedName();
  if (!name || GREET_NO_NAME.has(phrase)) return phrase;
  return phrase + ', ' + name;
}
function avatarMarkup() {
  const name = savedName();
  return name ? esc(name.charAt(0).toUpperCase()) : ic('person');
}
function syncAvatar() {
  const av = $('#avatarLg');
  if (av) av.innerHTML = avatarMarkup();
}

function spokenName(title) {
  const first = (String(title).match(/^\S+/) || [''])[0];
  const acronym = first.length >= 2 && first === first.toUpperCase() && /[A-Za-z]/.test(first);
  if (acronym) return title;
  return title.charAt(0).toLowerCase() + title.slice(1);
}
function warmLine(i) {
  const name = spokenName(i.title);
  if (i.plus) return 'Money came in safely';
  if (i.done) return "Paid. You're all set";
  if (i.cls === 't-overdue') return `Your ${name} is a day overdue`;
  if (i.cls === 't-today') return `Your ${name} is due today`;
  if (i.cat === 'delivery') return 'Your parcel is on its way';
  if (i.reminder) return `Coming up: ${name}`;
  return `Your ${name} is coming up`;
}
function rowAmount(i, base) {
  if (i.amount == null) {
    const soft = base === 'amount' ? 'amount muted-amt' : 'g-amt soft';

  return `<div class="${base} num${i.plus ? ' plus' : ''}">${i.plus ? '+' : ''}${inr(i.amount)}</div>`;
}

const ONB = ['signin', 'explainer', 'allowlist', 'handoff', 'allset'];

/* ---------- layers + navigation ---------- */
function makeLayer(scr) {
  const el = document.createElement('div');
  el.className = 'layer' + (ONB.includes(scr.name) ? ' onb' : '');
  el.dataset.screen = scr.name;
  el.innerHTML = T[scr.name](scr.params || {});
  scr.el = el;
  return el;
}
function rerender(scr, keepScroll = true) {
  const c = $('.content', scr.el), top = c ? c.scrollTop : 0;
  scr.el.innerHTML = T[scr.name](scr.params || {});
  if (keepScroll && $('.content', scr.el)) $('.content', scr.el).scrollTop = top;
}
const topScr = () => S.stack[S.stack.length - 1];
function setInert() { S.stack.forEach((s, k) => { if (k < S.stack.length - 1) s.el.setAttribute('inert', ''); else s.el.removeAttribute('inert'); }); }
function rectIn(el) {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { t: r.top - s.top, l: r.left - s.left, b: s.bottom - r.bottom, r: s.right - r.right };
}
const clip = (o, rad) => `inset(${o.t}px ${o.r}px ${o.b}px ${o.l}px round ${rad}px)`;
const FULL = 'inset(0px 0px 0px 0px round 0px)';
const radiusOf = el => parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
let histDepth = 0;
let skipPop = 0;
function pushHist() { try { history.pushState({ d: ++histDepth }, ''); } catch (e) { histDepth--; } }
function consumeOne() { if (histDepth > 0) { histDepth--; skipPop++; history.back(); } }        // internal back: drop our history entry
function consumeAll() { if (histDepth > 0) { const n = histDepth; histDepth = 0; skipPop++; history.go(-n); } }

async function fadeIn(el, d = M.fade) { await anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: d, easing: E.std }); }
async function fadeOut(el, d = M.fade) { await anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: d, easing: E.std, fill: 'forwards' }); }

// Motion is navigation. Durations and easings stay on the token sheet: nothing bounces, loops, or runs past 300ms.
const ENTRANCE = {
  signin: '.brand-hero, .onb-actions',
  explainer: '.onb-title, .onb-sub, .point, .onb-actions',
  allowlist: '.onb-title, .onb-sub, .app-group, .add-row, .onb-actions',
  handoff: '.onb-title, .onb-sub, .android-mock, .steps, .onb-actions',
  allset: '.done-ic, .onb-title, .onb-sub, .mini-frame, .honest, .onb-actions',
  glance: '.topbar, .greet, .g-card, .nav-wrap',
  feed: '.topbar, .chips, .feed-sum, .list .card, .list-empty, .nav-wrap',
  reminders: '.topbar, .feed-sum, .list .card, .list-empty, .nav-wrap',
  detail: '.topbar, .hero, .section-label, .x-card, .kv, .detail-foot',
  profile: '.topbar, .profile, .section-label, .s-group',
};
function entranceTargets(layer) {
  const sel = ENTRANCE[layer.dataset.screen];
  const nodes = sel ? $$(sel, layer) : [];
  const bar = $('.gesturebar', layer);
  if (bar && !nodes.includes(bar)) nodes.push(bar);
  return nodes;
}
function riseFrames(reduce) {
  return reduce
    ? [{ opacity: 0 }, { opacity: 1 }]
    : [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }];
}
// First appearance only. Re-rendering a layer keeps data-entered, so the rise does not replay.
async function entrance(layer) {
  if (!layer || layer.dataset.entered) return;
  layer.dataset.entered = '1';
  const items = entranceTargets(layer);
  const reduce = RM.matches;
  if (!items.length) return fadeIn(layer, M.fade);
  await Promise.all(items.map((el, i) => anim(el, riseFrames(reduce), {
    duration: reduce ? M.fade : M.medium,
    delay: reduce ? 0 : Math.min(i, 3) * 20,
    easing: reduce ? E.std : E.dec,
    fill: 'backwards',
  })));
}
function shift(fromEl, toEl) {
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  return `translate(${a.left - b.left}px, ${a.top - b.top}px)`;
}
function flyGhost(layer, srcEl) {
  const host = layer.getBoundingClientRect(), a = srcEl.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'title-medium fly-ghost';
  ghost.textContent = (srcEl.textContent || '').trim();
  ghost.style.left = (a.left - host.left) + 'px';
  ghost.style.top = (a.top - host.top) + 'px';
  layer.appendChild(ghost);
  return ghost;
}
function fadeRest(nodes, dir) {
  const reduce = RM.matches;
  const inbound = dir === 'in';
  return nodes.map((el, i) => anim(el, inbound ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 0 }], {
    duration: reduce ? M.fade : (inbound ? M.medium : M.short),
    delay: reduce || !inbound ? 0 : Math.min(i, 3) * 20,
    easing: inbound ? E.dec : E.acc,
    fill: inbound ? 'backwards' : 'forwards',
  }));
}
async function containerIn(layer, originEl) {
  if (RM.matches || !originEl) return fadeIn(layer, M.fade);
  const o = rectIn(originEl), rad = radiusOf(originEl);
  const kids = [...layer.children];
  const a = anim(layer, [{ clipPath: clip(o, rad) }, { clipPath: FULL }], { duration: M.enter, easing: E.dec, fill: 'both' });
  const b = Promise.all(kids.map(k => anim(k, [{ opacity: 0 }, { opacity: 1 }], { duration: M.medium, easing: E.dec, fill: 'backwards' })));
  await Promise.all([a, b]);
  layer.dataset.entered = '1';
}
async function containerOut(layer, originEl) {

  S.stack.forEach(s => { const n = STEP_OF[s.name]; if (n) S.seen[n] = true; });
  if (S.sheet) S.seen[9] = true;
  $('#stepsInd').innerHTML = STEPS.map((s, k) => `<li class="${k + 1 === c ? 'cur' : S.seen[k + 1] ? 'done' : ''}" data-step="${k + 1}"><span class="n">${k + 1}</span>${s}</li>`).join('');
  const t = topScr();
  $('#stepText').textContent = c ? `Step ${c} of 10 · ${STEPS[c - 1]}` : (t && t.name === 'reminders' ? 'Reminders tab (not a numbered step)' : '');
}
function jump(step) {                                      // rebuild a sensible stack for any step, no animation
  cancelHold();
  if (S.busy) return; consumeAll();
  if (S.sheet) { S.sheet.scrim.remove(); S.sheet.sheet.remove(); S.sheet = null; }
  S.stack.forEach(s => s.el.remove()); S.stack = [];
  if (step >= 3 && !chosen().length) { S.apps.hdfc = true; S.apps.amazon = true; }
  const add = (name, params = {}, how = 'slide', origin = null) => { const scr = { name, params, how, origin }; stage.appendChild(makeLayer(scr)); S.stack.push(scr); };
  if (step <= 5) ONB.slice(0, step).forEach((n, k) => add(n, {}, k ? 'slide' : 'root'));
  else if (step === 6) add('glance', {}, 'root');
  else if (step === 7) { add('glance', {}, 'root'); add('feed', { filter: 'Bills', pushed: true }, 'unfold', { card: 'priorities' }); }
  else if (step === 8 || step === 9) { add('glance', {}, 'root'); add('detail', { id: (S.items.find(i => i.priority) || S.items[0]).id }, 'grow', { item: (S.items.find(i => i.priority) || S.items[0]).id }); }
  else add('profile', {}, 'root');
  setInert(); updateSteps();
  if (step === 9) openSheet();
}
$('#stepsInd').addEventListener('click', e => { const li = e.target.closest('li'); if (li) jump(+li.dataset.step); });
function restart() {
  cancelHold();
  if (S) consumeAll();
  if (S && S.sheet) { S.sheet.scrim.remove(); S.sheet.sheet.remove(); }
  $$('.layer, .snackbar', phone).forEach(l => l.remove());
  S = freshState();
  const scr = { name: 'glance', params: {}, how: 'root' };
  stage.appendChild(makeLayer(scr)); S.stack = [scr]; setInert(); updateSteps();
  entrance(scr.el);
}
$('#restartBtn').addEventListener('click', restart);
$('#firstRunBtn').addEventListener('click', () => { clearFirstRun(); restart(); });
restart();
window.__proto = { get state() { return S; }, jump, restart, M, greetingText, savedName, hourNow, warmLine, spokenName };   // for scripted tests
